workflows:
  ridego-android:
    name: RideGo Android APKs
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Build Rider APK
        script: |
          cd rider
          flutter pub get
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY is required"
            exit 1
          fi
          flutter build apk --release \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            --dart-define=GOOGLE_MAPS_ANDROID_CERT="$GOOGLE_MAPS_ANDROID_CERT"
      - name: Build Driver APK
        script: |
          cd driver
          flutter pub get
          flutter build apk --release
    artifacts:
      - rider/build/app/outputs/flutter-apk/*.apk
      - driver/build/app/outputs/flutter-apk/*.apk
