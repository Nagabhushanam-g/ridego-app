workflows:
  ridego-android:
    name: RideGo Android APKs
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Build Rider APK
        script: |
          cd rider
          flutter pub get
          flutter build apk --release
      - name: Build Driver APK
        script: |
          cd driver
          flutter pub get
          flutter build apk --release
    artifacts:
      - rider/build/app/outputs/flutter-apk/*.apk
      - driver/build/app/outputs/flutter-apk/*.apk
