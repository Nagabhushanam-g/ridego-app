workflows:
  ridego-android:
    name: RideGo Android APKs
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        GOOGLE_MAPS_API_KEY: $GOOGLE_MAPS_API_KEY
        GOOGLE_MAPS_ANDROID_CERT: $GOOGLE_MAPS_ANDROID_CERT
    scripts:
      - name: Prepare Rider
        script: |
          cd rider
          flutter pub get
          flutter analyze
      - name: Prepare Driver
        script: |
          cd driver
          flutter pub get
          flutter analyze
      - name: Build Rider APK
        script: |
          cd rider
          flutter build apk --release \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            --dart-define=GOOGLE_MAPS_ANDROID_CERT="$GOOGLE_MAPS_ANDROID_CERT"
      - name: Build Driver APK
        script: |
          cd driver
          flutter build apk --release \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            --dart-define=GOOGLE_MAPS_ANDROID_CERT="$GOOGLE_MAPS_ANDROID_CERT"
    artifacts:
      - rider/build/app/outputs/flutter-apk/*.apk
      - driver/build/app/outputs/flutter-apk/*.apk
