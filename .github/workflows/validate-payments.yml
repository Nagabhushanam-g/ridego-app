name: Validate RideGo Payment Branch

on:
  push:
    branches:
      - feature/payments-from-tested-build
    paths:
      - 'scripts/release-preflight.cjs'
      - 'scripts/verify-release-candidate.cjs'
      - 'scripts/verify-release-candidate.test.cjs'
      - 'rider/**'
      - 'driver/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'rules-tests/**'
      - 'firebase.json'
      - '.github/workflows/build-payment-test-apks.yml'
      - '.github/workflows/validate-payments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    name: Check release configuration readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static release configuration
        run: node scripts/release-preflight.cjs
      - name: Test offline release candidate checksum verification
        run: node --test scripts/verify-release-candidate.test.cjs

  flutter-analyze:
    name: Analyze ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rider, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch Flutter dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: ${{ matrix.app }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  functions-syntax:
    name: Check Firebase Functions syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check functions/index.js && node --check functions/cash_confirmation_policy.js && node --check functions/cash_confirmation_transaction.js
      - name: Test cash commission accounting
        run: npm --prefix functions install --no-audit --no-fund && node --test functions/commission.test.js functions/cash_confirmation_policy.test.js functions/ridego_payment_regression.test.js functions/ridego_rc_storage_guard.test.js functions/partner_review_policy.test.js functions/partner_review_adapter.test.js functions/partner_review_transaction.test.js functions/partner_review_rules_guard.test.js functions/partner_review_evidence.test.js functions/partner_online_eligibility.test.js functions/partner_online_assessment.test.js functions/partner_online_grant_check.test.js functions/account_deletion_request_validation.test.js
      - name: Test DigiLocker preparation safeguards
        run: node --test functions/digilocker_state.test.js functions/digilocker_session.test.js functions/digilocker_callback.test.js functions/digilocker_callback_flow.test.js functions/digilocker_session_create.test.js functions/digilocker_session_store.test.js functions/digilocker_partner_session.test.js functions/digilocker_cleanup.test.js functions/digilocker_rate_limit.test.js functions/digilocker_callable_adapter.test.js functions/digilocker_callback_lookup.test.js functions/digilocker_resolved_callback.test.js functions/digilocker_audit.test.js functions/digilocker_safe_error.test.js functions/digilocker_audited_flow.test.js functions/digilocker_release_guard.test.js functions/digilocker_firestore_guard.test.js
      - name: Check package metadata
        run: node -e "const p=require('./functions/package.json');if(!p.dependencies['firebase-functions'] || !p.dependencies['firebase-admin'])process.exit(1)"

  cash-emulator:
    name: Test concurrent cash payments in Firestore Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase dependencies and CLI
        run: npm --prefix functions install --no-audit --no-fund && npm install --no-save firebase-tools
      - name: Run simultaneous cash confirmations against emulator
        run: npx firebase emulators:exec --only firestore --project ridego-cash-integrity-test "node --test functions/cash_confirmation_emulator.test.js"

  digilocker-emulator:
    name: Test DigiLocker replay prevention in Firestore Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase dependencies and CLI
        run: npm --prefix functions install --no-audit --no-fund && npm install --no-save firebase-tools
      - name: Run DigiLocker transaction tests against emulator
        run: npx firebase emulators:exec --only firestore --project ridego-digilocker-security-test "node --test functions/digilocker_emulator.test.js functions/digilocker_atomic_emulator.test.js functions/digilocker_callback_emulator.test.js functions/digilocker_cleanup_emulator.test.js"

  profile-rules-emulator:
    name: Test Partner profile security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rule-test dependencies and Firebase CLI
        run: npm --prefix rules-tests install --no-audit --no-fund && npm install --no-save firebase-tools
      - name: Run profile authorization tests against emulator
        run: npx firebase emulators:exec --only firestore --project ridego-security-test "npm --prefix rules-tests test"

  partner-review-emulator:
    name: Test concurrent Partner reviews in Firestore Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase dependencies and CLI
        run: npm --prefix functions install --no-audit --no-fund && npm install --no-save firebase-tools
      - name: Run simultaneous Partner reviews against emulator
        run: npx firebase emulators:exec --only firestore --project ridego-partner-review-test "node --test functions/partner_review_emulator.test.js functions/partner_review_transition_emulator.test.js functions/partner_review_recheck_emulator.test.js functions/partner_online_transaction_emulator.test.js functions/partner_dispatch_transaction_emulator.test.js functions/account_deletion_request_emulator.test.js"
