name: Build RideGo Payment Test APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/payments-from-tested-build
    paths:
      - 'rider/**'
      - 'driver/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/build-payment-test-apks.yml'
      - '.github/workflows/validate-payments.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # -------------------- RIDER --------------------
      - name: Build Rider APK with permanent signing
        working-directory: rider
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_RIDER_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_RIDER_GOOGLE_SERVICES_JSON }}
          RIDER_KEYSTORE_BASE64: ${{ secrets.RIDER_KEYSTORE_BASE64 }}
          RIDER_KEYSTORE_PASSWORD: ${{ secrets.RIDER_KEYSTORE_PASSWORD }}
          RIDER_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          RIDER_KEY_PASSWORD: ${{ secrets.RIDER_KEY_PASSWORD }}
          RIDEGO_KEYSTORE_PATH: ${{ github.workspace }}/rider/android/app/rider-release.jks
          RIDEGO_KEYSTORE_PASSWORD: ${{ secrets.RIDER_KEYSTORE_PASSWORD }}
          RIDEGO_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          RIDEGO_KEY_PASSWORD: ${{ secrets.RIDER_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "GOOGLE_MAPS_API_KEY repository secret is not configured."; exit 1; }
          test -n "$FIREBASE_RIDER_GOOGLE_SERVICES_JSON" || { echo "FIREBASE_RIDER_GOOGLE_SERVICES_JSON repository secret is not configured."; exit 1; }
          test -n "$RIDER_KEYSTORE_BASE64" || { echo "RIDER_KEYSTORE_BASE64 repository secret is not configured."; exit 1; }
          test -n "$RIDER_KEYSTORE_PASSWORD" || { echo "RIDER_KEYSTORE_PASSWORD repository secret is not configured."; exit 1; }
          test -n "$RIDER_KEY_ALIAS" || { echo "RIDER_KEY_ALIAS repository secret is not configured."; exit 1; }
          test -n "$RIDER_KEY_PASSWORD" || { echo "RIDER_KEY_PASSWORD repository secret is not configured."; exit 1; }

          flutter create --platforms=android .
          flutter pub get

          printf '%s' "$FIREBASE_RIDER_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          # Fail before compilation if the injected Firebase Android client
          # does not match this app's immutable Android application ID.
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          expected = "com.ridego.rider"
          clients = [entry.get("client_info", {}).get("android_client_info", {}).get("package_name")
                     for entry in config.get("client", [])]
          if expected not in clients:
              raise SystemExit("Firebase Android package mismatch for rider; check the repository secret.")
          project = config.get("project_info", {})
          if project.get("project_id") != "ridego-af7c3" or str(project.get("project_number")) != "7718021506":
              raise SystemExit("Firebase project mismatch for rider: expected RideGo ridego-af7c3 (7718021506). Update the GitHub Firebase JSON secret.")
          print("Firebase project and Android package verified for rider: ridego-af7c3.")
          PY

          printf '%s' "$RIDER_KEYSTORE_BASE64" | base64 --decode > android/app/rider-release.jks
          test -s android/app/rider-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  '    id("org.jetbrains.kotlin.android") version "2.4.0" apply false\n',
                  '    id("org.jetbrains.kotlin.android") version "2.4.0" apply false\n'
                  '    id("com.google.gms.google-services") version "4.5.0" apply false\n',
                  1,
              )
          settings.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.geo\.API_KEY"\s+android:value="[^"]*"\s*/>',
              '',
              text,
          )

          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
                  1,
              )

          # Accept the branded icon introduced in the current RideGo build,
          # while retaining compatibility with older default launcher icons.
          marker = re.search(r'android:icon="@(?:mipmap/ic_launcher|drawable/ridego_rider_icon)"\s*>', text)
          if marker is None:
              raise SystemExit("Could not find Android application element in Rider manifest.")

          text = text.replace(
              marker.group(0),
              marker.group(0) + '\n'
              '        <meta-data\n'
              '            android:name="com.google.android.geo.API_KEY"\n'
              '            android:value="' + os.environ["GOOGLE_MAPS_API_KEY"] + '"/>',
              1,
          )
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()

          if 'id("com.google.gms.google-services")' not in g:
              g = g.replace(
                  '    id("com.android.application")\n',
                  '    id("com.android.application")\n'
                  '    id("com.google.gms.google-services")\n',
                  1,
              )

          signing_block = '''android {\n    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("RIDEGO_KEYSTORE_PATH"))\n            storePassword = System.getenv("RIDEGO_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("RIDEGO_KEY_ALIAS")\n            keyPassword = System.getenv("RIDEGO_KEY_PASSWORD")\n        }\n    }\n'''
          g = g.replace('android {\n', signing_block, 1)
          g = g.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          gradle.write_text(g)
          PY

          echo "--- Rider configuration check ---"
          grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
          grep -q 'id("com.google.gms.google-services")' android/settings.gradle.kts
          grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts
          test -s android/app/google-services.json
          echo "Google Maps metadata: PRESENT"
          echo "Location permissions: PRESENT"
          echo "Firebase google-services.json: PRESENT"
          echo "Firebase Google Services plugin: CONFIGURED"
          echo "Permanent Rider signing: CONFIGURED"
          echo "API key value is not printed for security."

          RIDER_CERT_SHA1=$(keytool -list -v -keystore "$RIDEGO_KEYSTORE_PATH" -storepass "$RIDER_KEYSTORE_PASSWORD" -alias "$RIDER_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':')
          test -n "$RIDER_CERT_SHA1" || { echo "Could not calculate Rider signing certificate SHA-1."; exit 1; }
          echo "Rider certificate fingerprint prepared for Places requests."

          flutter build apk --release             --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"             --dart-define=GOOGLE_MAPS_ANDROID_CERT="$RIDER_CERT_SHA1"
          flutter build appbundle --release             --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"             --dart-define=GOOGLE_MAPS_ANDROID_CERT="$RIDER_CERT_SHA1"

      - name: Verify Rider release signing
        working-directory: rider/android
        env:
          RIDEGO_KEYSTORE_PATH: ${{ github.workspace }}/rider/android/app/rider-release.jks
          RIDEGO_KEYSTORE_PASSWORD: ${{ secrets.RIDER_KEYSTORE_PASSWORD }}
          RIDEGO_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          RIDEGO_KEY_PASSWORD: ${{ secrets.RIDER_KEY_PASSWORD }}
        run: ./gradlew signingReport

      # -------------------- DRIVER --------------------
      - name: Build Driver APK with permanent signing and Firebase
        working-directory: driver
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_DRIVER_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_DRIVER_GOOGLE_SERVICES_JSON }}
          DRIVER_KEYSTORE_BASE64: ${{ secrets.DRIVER_KEYSTORE_BASE64 }}
          DRIVER_KEYSTORE_PASSWORD: ${{ secrets.DRIVER_KEYSTORE_PASSWORD }}
          DRIVER_KEY_ALIAS: ${{ secrets.DRIVER_KEY_ALIAS }}
          DRIVER_KEY_PASSWORD: ${{ secrets.DRIVER_KEY_PASSWORD }}
          RIDEGO_KEYSTORE_PATH: ${{ github.workspace }}/driver/android/app/driver-release.jks
          RIDEGO_KEYSTORE_PASSWORD: ${{ secrets.DRIVER_KEYSTORE_PASSWORD }}
          RIDEGO_KEY_ALIAS: ${{ secrets.DRIVER_KEY_ALIAS }}
          RIDEGO_KEY_PASSWORD: ${{ secrets.DRIVER_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "GOOGLE_MAPS_API_KEY repository secret is not configured."; exit 1; }
          test -n "$FIREBASE_DRIVER_GOOGLE_SERVICES_JSON" || { echo "FIREBASE_DRIVER_GOOGLE_SERVICES_JSON repository secret is not configured."; exit 1; }
          test -n "$DRIVER_KEYSTORE_BASE64" || { echo "DRIVER_KEYSTORE_BASE64 repository secret is not configured."; exit 1; }
          test -n "$DRIVER_KEYSTORE_PASSWORD" || { echo "DRIVER_KEYSTORE_PASSWORD repository secret is not configured."; exit 1; }
          test -n "$DRIVER_KEY_ALIAS" || { echo "DRIVER_KEY_ALIAS repository secret is not configured."; exit 1; }
          test -n "$DRIVER_KEY_PASSWORD" || { echo "DRIVER_KEY_PASSWORD repository secret is not configured."; exit 1; }

          flutter create --platforms=android .
          flutter pub get

          printf '%s' "$FIREBASE_DRIVER_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          # Fail before compilation if the injected Firebase Android client
          # does not match this app's immutable Android application ID.
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          expected = "com.example.ridego_driver"
          clients = [entry.get("client_info", {}).get("android_client_info", {}).get("package_name")
                     for entry in config.get("client", [])]
          if expected not in clients:
              raise SystemExit("Firebase Android package mismatch for driver; check the repository secret.")
          project = config.get("project_info", {})
          if project.get("project_id") != "ridego-af7c3" or str(project.get("project_number")) != "7718021506":
              raise SystemExit("Firebase project mismatch for driver: expected RideGo ridego-af7c3 (7718021506). Update the GitHub Firebase JSON secret.")
          print("Firebase project and Android package verified for driver: ridego-af7c3.")
          PY

          printf '%s' "$DRIVER_KEYSTORE_BASE64" | base64 --decode > android/app/driver-release.jks
          test -s android/app/driver-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  '    id("org.jetbrains.kotlin.android") version "2.4.0" apply false\n',
                  '    id("org.jetbrains.kotlin.android") version "2.4.0" apply false\n'
                  '    id("com.google.gms.google-services") version "4.5.0" apply false\n',
                  1,
              )
          settings.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.geo\.API_KEY"\s+android:value="[^"]*"\s*/>',
              '',
              text,
          )

          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
                  1,
              )

          # Accept the branded icon introduced in the current RideGo build,
          # while retaining compatibility with older default launcher icons.
          marker = re.search(r'android:icon="@(?:mipmap/ic_launcher|drawable/ridego_partner_icon)"\s*>', text)
          if marker is None:
              raise SystemExit("Could not find Android application element in Driver manifest.")

          text = text.replace(
              marker.group(0),
              marker.group(0) + '\n'
              '        <meta-data\n'
              '            android:name="com.google.android.geo.API_KEY"\n'
              '            android:value="' + os.environ["GOOGLE_MAPS_API_KEY"] + '"/>',
              1,
          )
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()

          if 'id("com.google.gms.google-services")' not in g:
              g = g.replace(
                  '    id("com.android.application")\n',
                  '    id("com.android.application")\n'
                  '    id("com.google.gms.google-services")\n',
                  1,
              )

          signing_block = '''android {\n    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("RIDEGO_KEYSTORE_PATH"))\n            storePassword = System.getenv("RIDEGO_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("RIDEGO_KEY_ALIAS")\n            keyPassword = System.getenv("RIDEGO_KEY_PASSWORD")\n        }\n    }\n'''
          g = g.replace('android {\n', signing_block, 1)
          g = g.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          gradle.write_text(g)
          PY

          echo "--- Driver configuration check ---"
          grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
          grep -q 'id("com.google.gms.google-services")' android/settings.gradle.kts
          grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts
          test -s android/app/google-services.json
          echo "Google Maps metadata: PRESENT"
          echo "Location permissions: PRESENT"
          echo "Firebase google-services.json: PRESENT"
          echo "Firebase Google Services plugin: CONFIGURED"
          echo "Permanent Driver signing: CONFIGURED"
          echo "API key value is not printed for security."

          flutter build apk --release
          flutter build appbundle --release

      - name: Verify Driver release signing
        working-directory: driver/android
        env:
          RIDEGO_KEYSTORE_PATH: ${{ github.workspace }}/driver/android/app/driver-release.jks
          RIDEGO_KEYSTORE_PASSWORD: ${{ secrets.DRIVER_KEYSTORE_PASSWORD }}
          RIDEGO_KEY_ALIAS: ${{ secrets.DRIVER_KEY_ALIAS }}
          RIDEGO_KEY_PASSWORD: ${{ secrets.DRIVER_KEY_PASSWORD }}
        run: ./gradlew signingReport

      # -------------------- ARTIFACTS --------------------
      - name: Verify Play Store AAB files
        run: |
          test -s rider/build/app/outputs/bundle/release/app-release.aab
          test -s driver/build/app/outputs/bundle/release/app-release.aab

      - name: Verify built APK application identities
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT" || { echo "::error::Android aapt is unavailable"; exit 1; }
          for app in rider driver; do
            case "$app" in
              rider) expected="com.ridego.rider" ;;
              driver) expected="com.example.ridego_driver" ;;
            esac
            apk="$app/build/app/outputs/flutter-apk/app-release.apk"
            test -s "$apk"
            actual="$("$AAPT" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$app APK package mismatch: expected $expected; received ${actual:-missing}"
              exit 1
            fi
            echo "$app built APK application ID verified: $expected"
          done

      - name: Verify APK and AAB signing certificates before upload
        env:
          RIDER_KEYSTORE_PASSWORD: ${{ secrets.RIDER_KEYSTORE_PASSWORD }}
          RIDER_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          DRIVER_KEYSTORE_PASSWORD: ${{ secrets.DRIVER_KEYSTORE_PASSWORD }}
          DRIVER_KEY_ALIAS: ${{ secrets.DRIVER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_SIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APK_SIGNER" || { echo "Android apksigner is unavailable"; exit 1; }
          for app in rider driver; do
            if [ "$app" = rider ]; then
              alias="$RIDER_KEY_ALIAS"
              password="$RIDER_KEYSTORE_PASSWORD"
              keystore="rider/android/app/rider-release.jks"
            else
              alias="$DRIVER_KEY_ALIAS"
              password="$DRIVER_KEYSTORE_PASSWORD"
              keystore="driver/android/app/driver-release.jks"
            fi
            apk="$app/build/app/outputs/flutter-apk/app-release.apk"
            aab="$app/build/app/outputs/bundle/release/app-release.aab"
            test -s "$apk"
            test -s "$aab"
            expected="$(keytool -list -v -keystore "$keystore" -storepass "$password" -alias "$alias" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            [[ "$expected" =~ ^[A-F0-9]{64}$ ]] || { echo "Invalid expected signing fingerprint for $app"; exit 1; }
            "$APK_SIGNER" verify --verbose --print-certs "$apk" > "/tmp/$app-apk-signing.txt"
            actual="$(awk '/certificate SHA-256 digest:/ {sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); gsub(/[:[:space:]\r]/, ""); print toupper($0); exit}' "/tmp/$app-apk-signing.txt")"
            if [[ ! "$actual" =~ ^[A-F0-9]{64}$ ]]; then
              echo "::error::$app APK signer certificate digest could not be parsed."
              echo "Inspect apksigner output format and signing configuration; certificate details withheld."
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::$app APK signing certificate differs from configured release keystore."
              echo "Release keystore and APK signer fingerprints differ; values withheld."
              echo "Check Gradle release signing configuration and ensure the APK was rebuilt with the configured upload key."
              exit 1
            fi
            jarsigner -verify "$aab" > "/tmp/$app-aab-signing.txt" || {
              echo "$app AAB signature verification failed"; exit 1;
            }
            # The bundle must be signed by the same configured upload key.
            keytool -printcert -jarfile "$aab" > "/tmp/$app-aab-cert.txt"
            bundle="$(awk '/SHA256:/ {sub(/^.*SHA256:[[:space:]]*/, ""); gsub(/[:[:space:]\r]/, ""); print toupper($0); exit}' "/tmp/$app-aab-cert.txt")"
            test "$bundle" = "$expected" || { echo "$app AAB signing certificate mismatch"; exit 1; }
            echo "$app APK and AAB signature verified against configured release keystore."
          done

      # Record exactly which signed binaries belong to this commit and run.
      - name: Generate release candidate provenance and SHA-256 checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          printf 'source_commit=%s\nworkflow_run_id=%s\n' "$SOURCE_COMMIT" "$SOURCE_RUN_ID" > release-candidate/provenance.txt
          sha256sum \
            rider/build/app/outputs/flutter-apk/app-release.apk \
            rider/build/app/outputs/bundle/release/app-release.aab \
            driver/build/app/outputs/flutter-apk/app-release.apk \
            driver/build/app/outputs/bundle/release/app-release.aab \
            > release-candidate/SHA256SUMS
          sha256sum --check release-candidate/SHA256SUMS
          echo "Signed Rider and Partner APK/AAB checksums recorded (digests not logged)."

      # Independently re-read the generated manifest and verify all four binaries
      # against the exact checked-out source commit before publishing artifacts.
      - name: Verify release candidate manifest against source commit
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-release-candidate.cjs . "$EXPECTED_SOURCE_COMMIT"

      - name: Upload release candidate provenance
        uses: actions/upload-artifact@v4
        with:
          name: ridego-release-candidate-provenance
          path: release-candidate/
          if-no-files-found: error

      # No APK/AAB artifact is published before both apps pass signing verification.
      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-payment-test-rider-apk
          path: rider/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Verify Partner APK exists before upload
        run: test -s driver/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-payment-test-partner-apk
          path: driver/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload Rider Play Store candidate AAB
        uses: actions/upload-artifact@v4
        with:
          name: ridego-rider-play-candidate-aab
          path: rider/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Partner Play Store candidate AAB
        uses: actions/upload-artifact@v4
        with:
          name: ridego-partner-play-candidate-aab
          path: driver/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
