name: Build RideGo APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Rider APK
        working-directory: rider
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "GOOGLE_MAPS_API_KEY repository secret is not configured."; exit 1; }
          flutter create --platforms=android .
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          # Remove any previously generated Maps key entry, then inject the
          # current GitHub Actions secret only into the runner workspace.
          text = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.geo\.API_KEY"\s+android:value="[^"]*"\s*/>',
              '',
              text,
          )
          text = text.replace(
              '<application',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n\n'
              '    <application',
              1,
          )
          text = text.replace(
              '<application',
              '<application',
              1,
          )
          text = text.replace(
              'android:icon="@mipmap/ic_launcher">',
              'android:icon="@mipmap/ic_launcher">\n'
              '        <meta-data\n'
              '            android:name="com.google.android.geo.API_KEY"\n'
              '            android:value="' + os.environ["GOOGLE_MAPS_API_KEY"] + '"/>',
              1,
          )
          path.write_text(text)
          PY
          flutter build apk --release

      - name: Show Rider signing SHA-1
        working-directory: rider/android
        run: ./gradlew signingReport

      - name: Build Driver APK
        working-directory: driver
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - name: Show Driver signing SHA-1
        working-directory: driver/android
        run: ./gradlew signingReport

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-rider-apk
          path: rider/build/app/outputs/flutter-apk/*.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-driver-apk
          path: driver/build/app/outputs/flutter-apk/*.apk
