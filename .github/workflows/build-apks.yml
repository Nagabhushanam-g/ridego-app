name: Build RideGo APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================
      # BUILD RIDER APK
      # ============================================
      - name: Build Rider APK
        working-directory: rider
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter create --platforms=android .

          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          # Add location permissions
          permissions = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          """

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          # Get Google Maps API key from GitHub Actions environment
          maps_key = os.environ.get("GOOGLE_MAPS_API_KEY", "").strip()

          if not maps_key:
              raise RuntimeError(
                  "GOOGLE_MAPS_API_KEY is empty. "
                  "Check GitHub Settings > Secrets and variables > Actions."
              )

          # Add Google Maps API key inside <application>
          meta_data = (
              '        <meta-data '
              'android:name="com.google.android.geo.API_KEY" '
              f'android:value="{maps_key}"/>'
          )

          if "com.google.android.geo.API_KEY" in text:
              import re

              text = re.sub(
                  r'\s*<meta-data\s+'
                  r'android:name="com\.google\.android\.geo\.API_KEY"'
                  r'[^>]*/>',
                  "\n" + meta_data,
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "<application",
                  "<application\n" + meta_data,
                  1
              )

          manifest.write_text(text)

          print("Google Maps API key successfully inserted into AndroidManifest.xml")
          PY

          echo "=== RIDER APPLICATION ID ==="
          grep -R "applicationId" android/app || true

          echo "=== VERIFY GOOGLE MAPS CONFIGURATION ==="
          grep -n "com.google.android.geo.API_KEY" android/app/src/main/AndroidManifest.xml || true

          flutter pub get
          flutter build apk --release

      # ============================================
      # BUILD DRIVER APK
      # ============================================
      - name: Build Driver APK
        working-directory: driver
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      # ============================================
      # UPLOAD RIDER APK
      # ============================================
      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-rider-apk
          path: rider/build/app/outputs/flutter-apk/*.apk

      # ============================================
      # UPLOAD DRIVER APK
      # ============================================
      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-driver-apk
          path: driver/build/app/outputs/flutter-apk/*.apk
