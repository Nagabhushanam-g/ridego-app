          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          maps_key = os.environ.get("GOOGLE_MAPS_API_KEY", "").strip()

          if not maps_key:
              raise RuntimeError(
                  "GOOGLE_MAPS_API_KEY is empty. "
                  "Check GitHub Settings > Secrets and variables > Actions."
              )

          # Add permissions immediately before <application>
          permissions = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          """

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace(
                  "    <application",
                  permissions + "\n    <application",
                  1
              )

          # Add Google Maps metadata immediately before the first activity.
          # This keeps it inside <application> without trying to rewrite
          # the XML structure.
          metadata = (
              '        <meta-data '
              'android:name="com.google.android.geo.API_KEY" '
              f'android:value="{maps_key}"/>\n'
          )

          if "com.google.android.geo.API_KEY" not in text:
              text = text.replace(
                  "        <activity",
                  metadata + "        <activity",
                  1
              )

          manifest.write_text(text)

          print("AndroidManifest.xml configured.")
          PY
