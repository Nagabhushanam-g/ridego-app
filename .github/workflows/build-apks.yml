name: Build RideGo APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Rider APK
        working-directory: rider
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - name: Show Rider signing SHA-1
        working-directory: rider/android
        run: ./gradlew signingReport

      - name: Build Driver APK
        working-directory: driver
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - name: Show Driver signing SHA-1
        working-directory: driver/android
        run: ./gradlew signingReport

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-rider-apk
          path: rider/build/app/outputs/flutter-apk/*.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: ridego-driver-apk
          path: driver/build/app/outputs/flutter-apk/*.apk

      - name: Save Android projects to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rider/android driver/android

          if git diff --cached --quiet; then
            echo "No Android project changes to commit."
          else
            git commit -m "Add generated Android projects"
            git push
          fi
