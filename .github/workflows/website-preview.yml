name: Build RideGo Website Preview

on:
  push:
    branches:
      - feature/payments-from-tested-build
    paths:
      - 'website/**'
      - '.github/workflows/website-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website pages and local links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag == 'link' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag in ('script', 'iframe') and 'src' in attrs:
                      self.links.append(attrs['src'])
          root = Path('website')
          required = ['index.html','preview.html','privacy.html','terms.html','safety.html','support.html','styles.css','script.js']
          for name in required:
              assert (root / name).is_file(), f'Missing: {name}'
          for html in root.glob('*.html'):
              parser = Links()
              parser.feed(html.read_text(encoding='utf-8'))
              for link in parser.links:
                  target = link.split('#')[0].split('?')[0]
                  if not target or '://' in target or target.startswith(('#','mailto:','tel:','/')):
                      continue
                  assert (root / target).is_file(), f'{html}: broken link {link}'
              print(f'Validated {html}')
          PY
      - name: Package local browser preview
        run: zip -r ridego-website-preview.zip website/
      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: ridego-website-preview
          path: ridego-website-preview.zip
          if-no-files-found: error
          retention-days: 30
