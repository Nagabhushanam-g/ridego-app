name: Build RideGo Website Preview

on:
  push:
    branches:
      - feature/payments-from-tested-build
    paths:
      - 'website/**'
      - '.github/workflows/website-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website pages, anchors and accessibility
        run: python3 website/check_site.py
      - name: Package local browser preview
        run: |
          mkdir -p ridego-website-preview
          cp website/*.html website/*.css website/*.js ridego-website-preview/
          cp -r website/assets ridego-website-preview/
          cat > ridego-website-preview/OPEN-WEBSITE-FIRST.txt <<'EOF'
          RIDEGO WEBSITE PREVIEW

          1. Extract the complete ZIP to a normal folder.
          2. Open index.html from inside the ridego-website-preview folder.
          3. Do NOT open the HTML files while they are still inside the ZIP.
          4. The styles.css and script.js files MUST stay beside index.html.
          5. Open preview.html to run the built-in stylesheet check.

          This is an offline development preview. No booking or payments are available.
          EOF
          zip -r ridego-website-preview.zip ridego-website-preview/
      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: ridego-website-preview
          path: ridego-website-preview.zip
          if-no-files-found: error
          retention-days: 30
