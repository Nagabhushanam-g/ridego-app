name: Build RideGo Website Preview

on:
  push:
    branches:
      - feature/payments-from-tested-build
    paths:
      - 'website/**'
      - '.github/workflows/website-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website pages and local links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag == 'link' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag in ('script', 'iframe') and 'src' in attrs:
                      self.links.append(attrs['src'])
          root = Path('website')
          required = ['index.html','preview.html','privacy.html','terms.html','safety.html','support.html','styles.css','script.js']
          for name in required:
              assert (root / name).is_file(), f'Missing: {name}'
          for html in root.glob('*.html'):
              parser = Links()
              parser.feed(html.read_text(encoding='utf-8'))
              for link in parser.links:
                  target = link.split('#')[0].split('?')[0]
                  if not target or '://' in target or target.startswith(('#','mailto:','tel:','/')):
                      continue
                  assert (root / target).is_file(), f'{html}: broken link {link}'
              print(f'Validated {html}')
          PY
      - name: Package local browser preview
        run: |
          mkdir -p ridego-website-preview
          cp website/*.html website/*.css website/*.js ridego-website-preview/
          cat > ridego-website-preview/OPEN-WEBSITE-FIRST.txt <<'EOF'
          RIDEGO WEBSITE PREVIEW

          1. Extract the complete ZIP to a normal folder.
          2. Open index.html from inside the ridego-website-preview folder.
          3. Do NOT open the HTML files while they are still inside the ZIP.
          4. The styles.css and script.js files MUST stay beside index.html.
          5. Open preview.html to run the built-in stylesheet check.

          This is an offline development preview. No booking or payments are available.
          EOF
          zip -r ridego-website-preview.zip ridego-website-preview/
      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: ridego-website-preview
          path: ridego-website-preview.zip
          if-no-files-found: error
          retention-days: 30
